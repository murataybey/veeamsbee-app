<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siaflex Sbee Intelligence</title>
<link rel="icon" type="image/png" href="/assets/siaflex-s.png">
<style>
  :root {
    --bg: #0f1419;
    --panel: #171e26;
    --panel-2: #1d2630;
    --border: #2a3644;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #00b336;
    --accent-soft: rgba(0, 179, 54, 0.12);
    --user-bubble: #1f4d2e;
    --amber: #d9a514;
    --amber-soft: rgba(217, 165, 20, 0.12);
    --red: #e5534b;
    --red-soft: rgba(229, 83, 75, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; }
  .brand img { height: 32px; display: block; }

  /* Siaflex "S" with a bottom-up fill animation: green -> dark green -> green */
  .slogo { position: relative; }
  .slogo img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .slogo .fill {
    position: absolute;
    inset: 0;
    background: #0d5a41;
    -webkit-mask: url('/assets/siaflex-s.png') center / contain no-repeat;
    mask: url('/assets/siaflex-s.png') center / contain no-repeat;
    clip-path: inset(100% 0 0 0);
  }
  .slogo.thinking .fill { animation: sfill 2s ease-in-out infinite; }
  @keyframes sfill {
    0%   { clip-path: inset(100% 0 0 0); }
    50%  { clip-path: inset(0 0 0 0); }
    100% { clip-path: inset(0 0 100% 0); }
  }
  .slogo.mini { width: 24px; height: 19px; flex-shrink: 0; }
  #cornerLogo {
    position: fixed;
    left: 22px;
    bottom: 112px;
    width: 58px;
    height: 46px;
    opacity: 0.55;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.3s;
  }
  #cornerLogo.thinking { opacity: 1; }

  /* Bouncing chatbot mascot */
  #chatbot {
    position: fixed;
    right: 20px;
    bottom: 96px;
    width: 160px;
    z-index: 6;
    cursor: pointer;
    user-select: none;
  }
  #chatbot .bot-body {
    animation: hopcycle 5.2s ease-in-out infinite;
    transform-origin: 50% 100%;
    will-change: transform;
  }
  /* Düşünürken: JS rastgele rota/aktivite seçer; arada yumuşak süzülme */
  #chatbot.thinking .bot-body { animation: hoverfloat 2.2s ease-in-out infinite; }
  @keyframes hoverfloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-9px); }
  }
  /* Hareket stilleri (JS süreyi ayarlar) */
  #chatbot .bot-body.anim-spin { animation: moveSpin 1.5s ease-in-out; }
  #chatbot .bot-body.anim-flip { animation: moveFlip 1.5s ease-in-out; }
  #chatbot .bot-body.anim-hop2 { animation: moveHop 1.5s ease-in-out; }
  @keyframes moveSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(720deg); }
  }
  @keyframes moveFlip {
    0%   { transform: translateY(0) rotate(0deg) scale(1, 1); }
    30%  { transform: translateY(-26px) rotate(180deg) scale(0.96, 1.05); }
    60%  { transform: translateY(0) rotate(360deg) scale(1.08, 0.9); }
    100% { transform: translateY(0) rotate(360deg) scale(1, 1); }
  }
  @keyframes moveHop {
    0%, 50%, 100% { transform: translateY(0) scale(1, 1); }
    15%, 65% { transform: translateY(-22px) scale(0.97, 1.04); }
    30%, 80% { transform: translateY(0) scale(1.06, 0.92); }
  }
  /* Sahneler: kahve, laptop, uyku, kitap, gazete */
  .prop { display: none; }
  #chatbot.scene-coffee .prop-coffee,
  #chatbot.scene-typing .prop-laptop,
  #chatbot.scene-sleep .prop-bed,
  #chatbot.scene-sleep .prop-zzz,
  #chatbot.scene-book .prop-book,
  #chatbot.scene-news .prop-news,
  #chatbot.scene-sport .prop-dumbbell,
  #chatbot.scene-music .prop-music,
  #chatbot.scene-tea .prop-tea { display: block; }
  #chatbot.scene-sleep .eye { display: none; }
  #chatbot.scene-sleep .prop.eye-closed { display: block; }
  #chatbot.scene-coffee .bot-body,
  #chatbot.scene-book .bot-body,
  #chatbot.scene-news .bot-body { animation: sway 3s ease-in-out infinite; }
  #chatbot.scene-typing .bot-body { animation: none; }
  #chatbot.scene-sleep .bot-body { animation: breathe 3.2s ease-in-out infinite; }
  #chatbot.scene-typing .hand { animation: typebob 0.16s ease-in-out infinite alternate; }
  #chatbot.scene-sleep .hand { animation: none; }
  @keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes typebob { from { transform: translateY(0); } to { transform: translateY(-6px); } }
  .steam { animation: steamrise 1.6s ease-out infinite; }
  .steam.s2 { animation-delay: 0.5s; }
  @keyframes steamrise {
    0% { opacity: 0.9; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-12px); }
  }
  .zz { animation: zzfloat 2.4s ease-in-out infinite; }
  .zz.z2 { animation-delay: 0.6s; }
  .zz.z3 { animation-delay: 1.2s; }
  @keyframes zzfloat {
    0% { opacity: 0; transform: translateY(5px); }
    40% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-10px); }
  }
  .codeline { animation: codeblink 0.9s steps(2) infinite; }
  .codeline.c2 { animation-delay: 0.3s; }
  .codeline.c3 { animation-delay: 0.6s; }
  @keyframes codeblink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  /* spor: halter kaldırma */
  #chatbot.scene-sport .bot-body { animation: squat 1.2s ease-in-out infinite; }
  #chatbot.scene-sport .hand { animation: handlift 1.2s ease-in-out infinite; }
  .dumbbell { animation: handlift 1.2s ease-in-out infinite; }
  @keyframes squat { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(7px) scale(1.05, 0.92); } }
  @keyframes handlift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-46px); } }
  /* müzik: ritim tutma + notalar */
  #chatbot.scene-music .bot-body { animation: groove 0.85s ease-in-out infinite; }
  @keyframes groove { 0%, 100% { transform: rotate(-5deg) translateY(0); } 50% { transform: rotate(5deg) translateY(-8px); } }
  .note { animation: notefloat 2s ease-out infinite; opacity: 0; }
  .note.n2 { animation-delay: 0.6s; }
  .note.n3 { animation-delay: 1.2s; }
  @keyframes notefloat {
    0% { opacity: 0; transform: translate(0, 8px); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translate(12px, -24px); }
  }
  /* çay: demlik ara ara döküyor */
  #chatbot.scene-tea .bot-body { animation: sway 3s ease-in-out infinite; }
  .teapot { animation: pour 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 65% 70%; }
  @keyframes pour { 0%, 55%, 100% { transform: rotate(0deg); } 70%, 85% { transform: rotate(-15deg); } }
  #chatbot .bot-shadow {
    width: 62%;
    height: 9px;
    margin: 2px auto 0;
    background: #000;
    border-radius: 50%;
    filter: blur(4px);
    opacity: 0.35;
    animation: shadowcycle 5.2s ease-in-out infinite;
    transform-origin: 50% 50%;
  }
  #chatbot.thinking .bot-shadow { animation: none; opacity: 0; }
  @keyframes hopcycle {
    0%   { transform: translateY(0) scale(1, 1); }
    7%   { transform: translateY(-10px) scale(1, 1); }
    14%  { transform: translateY(0) scale(1, 1); }
    21%  { transform: translateY(-10px) scale(1, 1); }
    28%  { transform: translateY(0) scale(1, 1); }
    38%  { transform: translateY(0) scale(1.14, 0.82); }
    48%  { transform: translateY(-42px) scale(0.94, 1.1) rotate(-7deg); }
    58%  { transform: translateY(0) scale(1.1, 0.88) rotate(0deg); }
    64%  { transform: translateY(-9px) scale(1, 1); }
    70%  { transform: translateY(0) scale(1, 1); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes shadowcycle {
    0%, 14%, 28%, 38%, 58%, 70%, 100% { transform: scaleX(1); opacity: 0.35; }
    7%, 21%, 64% { transform: scaleX(0.82); opacity: 0.25; }
    48% { transform: scaleX(0.55); opacity: 0.12; }
  }
  /* Tıklama numaraları — her tıklamada rastgele biri seçilir (en sonda: takla kuralını ezsinler) */
  #chatbot .bot-body.trick-flip { animation: trickFlip 0.9s ease-in-out; }
  #chatbot .bot-body.trick-wiggle { animation: trickWiggle 0.8s ease-in-out; }
  #chatbot .bot-body.trick-spin { animation: trickSpin 1.1s ease-in-out; }
  #chatbot .bot-body.trick-moon { animation: trickMoon 1.5s ease-in-out; }
  #chatbot .bot-body.trick-dizzy { animation: trickDizzy 1s ease-in-out; }
  @keyframes trickFlip {
    0%   { transform: translateY(0) scale(1.15, 0.8); }
    45%  { transform: translateY(-52px) rotate(360deg) scale(0.95, 1.08); }
    75%  { transform: translateY(0) scale(1.12, 0.85); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes trickWiggle {
    0%, 100% { transform: rotate(0deg); }
    15% { transform: rotate(-22deg); }
    35% { transform: rotate(20deg); }
    55% { transform: rotate(-14deg); }
    75% { transform: rotate(9deg); }
  }
  @keyframes trickSpin {
    0%   { transform: rotate(0deg) scale(1); }
    50%  { transform: rotate(360deg) scale(1.25); }
    100% { transform: rotate(720deg) scale(1); }
  }
  @keyframes trickMoon {
    0%   { transform: translateY(0) scale(1.12, 0.84); }
    30%  { transform: translateY(-130px) rotate(180deg) scale(1); }
    55%  { transform: translateY(-110px) rotate(360deg) scale(1); }
    85%  { transform: translateY(0) scale(1.1, 0.86); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes trickDizzy {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-14px) rotate(-10deg); }
    40% { transform: translateX(12px) rotate(8deg); }
    60% { transform: translateX(-9px) rotate(-6deg); }
    80% { transform: translateX(6px) rotate(4deg); }
  }
  #chatbot .bot-body svg { width: 100%; display: block; }
  /* top eller hafifçe süzülsün */
  #chatbot .hand { animation: handfloat 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  #chatbot .hand-r { animation-delay: 0.35s; }
  @keyframes handfloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .credit {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 5px 12px;
    font-size: 12.5px;
    color: var(--muted);
    cursor: default;
  }
  .credit b { color: var(--accent); font-weight: 700; }
  .credit.low b { color: var(--amber); }
  .credit.empty b { color: var(--red); }
  .iconbtn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    width: 34px; height: 34px;
    font-size: 17px;
    cursor: pointer;
    display: grid; place-items: center;
    transition: all 0.15s;
  }
  .iconbtn:hover { color: var(--text); border-color: var(--accent); }

  /* Ayarlar penceresi */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
  }
  /* display:flex, hidden özniteliğini ezmesin — kapatma bunun üzerinden çalışıyor */
  .modal-backdrop[hidden] { display: none !important; }
  .modal {
    width: min(760px, 94vw);
    height: min(520px, 88vh);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
  }
  .modal-side {
    width: 200px;
    flex-shrink: 0;
    background: var(--panel-2);
    border-right: 1px solid var(--border);
    padding: 16px 10px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .modal-title { font-size: 15px; font-weight: 700; padding: 4px 10px 12px; }
  .side-item {
    background: none; border: none;
    color: var(--muted);
    text-align: left;
    padding: 9px 12px;
    border-radius: 8px;
    font: inherit; font-size: 13.5px;
    cursor: pointer;
  }
  .side-item:hover { background: var(--panel); color: var(--text); }
  .side-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .modal-main { flex: 1; padding: 20px 24px; overflow-y: auto; position: relative; }
  .modal-close {
    position: absolute; top: 12px; right: 14px;
    background: none; border: none;
    color: var(--muted); font-size: 18px; cursor: pointer;
  }
  .modal-close:hover { color: var(--text); }
  .modal-main h2 { font-size: 16px; margin: 0 0 16px; }

  .server-row {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px;
    flex-wrap: wrap;
  }
  .server-row .srv-info { flex: 1; min-width: 180px; }
  .server-row .srv-name { font-weight: 650; }
  .server-row .srv-url { font-size: 12px; color: var(--muted); word-break: break-all; }
  .badge {
    font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 10px;
    text-transform: uppercase;
  }
  .badge.product { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
  .badge.on { background: var(--accent-soft); color: var(--accent); }
  .srv-status { font-size: 12px; width: 100%; }
  .srv-status.ok { color: var(--accent); }
  .srv-status.fail { color: var(--red); }
  .btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    font: inherit; font-size: 12.5px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #06230f; border-color: var(--accent); font-weight: 700; }
  .btn.danger:hover { border-color: var(--red); color: var(--red); }

  .form-grid { display: flex; flex-direction: column; gap: 12px; max-width: 400px; }
  .form-grid label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 4px; }
  .form-grid input[type="text"], .form-grid input[type="password"], .form-grid select {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 12px;
    font: inherit; font-size: 13.5px;
    outline: none;
  }
  .form-grid input:focus, .form-grid select:focus { border-color: var(--accent); }
  .form-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .form-msg { margin-top: 12px; font-size: 13px; }
  .form-msg.ok { color: var(--accent); }
  .form-msg.err { color: var(--red); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .dot.err { background: var(--red); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0 12px;
  }
  .thread {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg { display: flex; flex-direction: column; max-width: 92%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot  { align-self: flex-start; }
  .bubble {
    padding: 12px 16px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--panel);
    overflow-wrap: break-word;
  }
  .msg.user .bubble { background: var(--user-bubble); border-color: #2c6a40; white-space: pre-wrap; }
  .msg .who { font-size: 11.5px; color: var(--muted); margin: 0 6px 4px; }

  .bubble h1, .bubble h2, .bubble h3 { font-size: 1.05em; margin: 0.8em 0 0.4em; }
  .bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child, .bubble p:first-child { margin-top: 0; }
  .bubble p:last-child, .bubble ul:last-child, .bubble ol:last-child { margin-bottom: 0; }
  .bubble code {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 5px;
    font-size: 0.88em;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  .bubble pre {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
  }
  .bubble pre code { background: none; border: none; padding: 0; }
  .bubble a { color: #58a6ff; }
  .bubble table { border-collapse: collapse; margin: 8px 0; display: block; overflow-x: auto; max-width: 100%; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; font-size: 13.5px; }

  .df-wrap { margin-top: 10px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .df-title {
    padding: 8px 12px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
  }
  .df-scroll { overflow-x: auto; max-height: 420px; overflow-y: auto; }
  .df-scroll table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .df-scroll th, .df-scroll td { padding: 7px 12px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  .df-scroll th { position: sticky; top: 0; background: var(--panel-2); color: var(--muted); font-weight: 600; }
  .df-scroll tr:last-child td { border-bottom: none; }
  .df-scroll tr:hover td { background: var(--accent-soft); }

  .note { margin-top: 10px; padding: 9px 12px; border-radius: 8px; font-size: 13px; }
  .note.warning { background: var(--amber-soft); border: 1px solid var(--amber); color: var(--amber); }
  .bubble.error { background: var(--red-soft); border-color: var(--red); }

  .pending .bubble { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }

  .suggestions {
    max-width: 880px;
    margin: 0 auto;
    padding: 4px 20px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 16px;
    padding: 6px 13px;
    font-size: 12.5px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }

  footer {
    flex-shrink: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px 20px 10px;
  }
  .composer {
    max-width: 880px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 14px;
    font: inherit;
    min-height: 44px;
    max-height: 160px;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button.send {
    background: var(--accent);
    color: #06230f;
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    height: 44px;
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
  }
  button.send:disabled { opacity: 0.45; cursor: not-allowed; }
  .hint {
    max-width: 880px;
    margin: 6px auto 0;
    font-size: 11.5px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/assets/siaflex-logo-dark.png" alt="Siaflex"></div>
  <div class="status">
    <div class="credit" id="credit" title="Son 24 saatte bu arayüzden sorulan sorulara göre yerel sayaçtır. Veeam kota sayacını dışarı açmadığı için CLI veya VBR konsolundan sorulan sorular bu sayıya dahil değildir.">Kredi: <b id="creditVal">–</b></div>
    <span class="dot" id="statusDot"></span><span id="statusText">bağlanıyor…</span>
    <button class="iconbtn" id="settingsBtn" title="Ayarlar">⚙</button>
  </div>
</header>

<div class="modal-backdrop" id="settingsModal" hidden>
  <div class="modal">
    <div class="modal-side">

<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.js"></script>
<script>
  const thread = document.getElementById('thread');
  const main = document.getElementById('main');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  let busy = false;

  function scrollDown() { main.scrollTop = main.scrollHeight; }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function addUserMsg(text) {
    const msg = el('div', 'msg user');
    msg.appendChild(el('div', 'who', 'Siz'));
    msg.appendChild(el('div', 'bubble', text));
    thread.appendChild(msg);
    scrollDown();
  }

  const cornerLogo = document.getElementById('cornerLogo');
  const creditBox = document.getElementById('credit');
  const creditVal = document.getElementById('creditVal');
  let BOT_NAME = 'Siaflex Sbee Intelligence';

  async function loadConfig() {
    try {
      const r = await fetch('/api/config');
      if (!r.ok) return;
      const cfg = await r.json();
      if (cfg.title) {
        BOT_NAME = cfg.title;
        document.title = cfg.title;
        document.getElementById('welcomeWho').textContent = cfg.title;
      }
      if (cfg.welcome) document.getElementById('welcomeText').textContent = cfg.welcome;
      if (Array.isArray(cfg.suggestions)) {
        const box = document.getElementById('suggestions');
        box.innerHTML = '';
        cfg.suggestions.forEach(s => {
          const b = document.createElement('button');
          b.className = 'chip';
          b.textContent = s;
          box.appendChild(b);
        });
      }
      if (cfg.quotaEnabled === false) creditBox.style.display = 'none';
    } catch { /* varsayılanlarla devam */ }
  }

  function updateCredit(q) {
    if (!q || typeof q.remaining !== 'number') return;
    creditVal.textContent = q.remaining + '/' + q.limit;
    creditBox.classList.toggle('low', q.remaining > 0 && q.remaining <= 20);
    creditBox.classList.toggle('empty', q.remaining === 0);
  }

  function makeSLogo(cls) {
    const d = el('div', cls);
    const img = document.createElement('img');
    img.src = '/assets/siaflex-s.png';
    img.alt = '';
    d.appendChild(img);
    d.appendChild(el('div', 'fill'));
    return d;
  }

  const chatbot = document.getElementById('chatbot');
  const sbeeBody = chatbot.querySelector('.bot-body');

  // --- Sbee aktivite motoru ---
  // Cevap beklerken: uçuş + laptopta araştırma. 30 sn soru sorulmayınca: keyif sahneleri.
  const MOVE_STYLES = ['anim-spin', 'anim-flip', 'anim-hop2', '', ''];
  const THINK_SCENES = ['scene-typing'];
  const IDLE_SCENES = ['scene-coffee', 'scene-tea', 'scene-music', 'scene-sport', 'scene-book', 'scene-news', 'scene-sleep'];
  const ALL_SCENES = THINK_SCENES.concat(IDLE_SCENES);
  const IDLE_DELAY_MS = 30000;
  const DEEP_IDLE_MS = 120000;
  let sbeeTimer = null;
  let idleTimer = null;
  let idleStart = 0;
  let lastScene = '';

  function clearScenes() {
    ALL_SCENES.forEach(c => chatbot.classList.remove(c));
  }

  function sbeeNext() {
    if (!chatbot.classList.contains('thinking')) return;
    if (Math.random() < 0.6) {
      // Rastgele bir noktaya uç — her seferinde farklı rota, stil ve boyut
      const dur = 1.2 + Math.random() * 1.3;
      const maxX = Math.max(0, window.innerWidth - 280);
      const maxY = Math.max(0, window.innerHeight - 420);
      const tx = -(30 + Math.random() * maxX);
      const ty = -(Math.random() * maxY);
      const scale = [0.6, 0.8, 1, 1, 1.4, 1.8][Math.floor(Math.random() * 6)];
      chatbot.style.transition = 'transform ' + dur + 's cubic-bezier(.45,.05,.35,1)';
      chatbot.style.transform = 'translate(' + tx.toFixed(0) + 'px,' + ty.toFixed(0) + 'px) scale(' + scale + ')';
      const style = MOVE_STYLES[Math.floor(Math.random() * MOVE_STYLES.length)];
      if (style) {
        sbeeBody.classList.add(style);
        sbeeBody.style.animationDuration = dur + 's';
        setTimeout(() => { sbeeBody.classList.remove(style); sbeeBody.style.animationDuration = ''; }, dur * 1000);
      }
      sbeeTimer = setTimeout(sbeeNext, dur * 1000 + 300 + Math.random() * 900);
    } else {
      // Laptopta cevabı araştırıyor
      chatbot.classList.add('scene-typing');
      const dur = 3500 + Math.random() * 2500;
      sbeeTimer = setTimeout(() => {
        clearScenes();
        sbeeTimer = setTimeout(sbeeNext, 350);
      }, dur);
    }
  }

  // Boşta keyif sahneleri: kahve, çay, müzik, spor, kitap, gazete, uyku
  function idleNext() {
    if (chatbot.classList.contains('thinking')) return;
    let pool = IDLE_SCENES.filter(s => s !== lastScene);
    // Uzun süre boş kalınca uyku ağır bassın
    if (Date.now() - idleStart > DEEP_IDLE_MS && lastScene !== 'scene-sleep') {
      pool = pool.concat(['scene-sleep', 'scene-sleep']);
    }
    const scene = pool[Math.floor(Math.random() * pool.length)];
    lastScene = scene;
    chatbot.classList.add(scene);
    const dur = (scene === 'scene-sleep' ? 9000 : 5500) + Math.random() * 3000;
    idleTimer = setTimeout(() => {
      clearScenes();
      idleTimer = setTimeout(idleNext, 4000 + Math.random() * 6000);
    }, dur);
  }

  function stopIdle() {
    clearTimeout(idleTimer);
    idleTimer = null;
  }

  function scheduleIdle() {
    stopIdle();
    idleTimer = setTimeout(() => {
      idleStart = Date.now();
      idleNext();
    }, IDLE_DELAY_MS);
  }

  function setThinking(on) {
    cornerLogo.classList.toggle('thinking', on);
    chatbot.classList.toggle('thinking', on);
    clearTimeout(sbeeTimer);
    stopIdle();
    clearScenes();
    lastScene = '';
    if (on) {
      sbeeTimer = setTimeout(sbeeNext, 500);
    } else {
      // Eve dönüş, sonra boşta sayacı başlat
      chatbot.style.transition = 'transform 0.9s ease-in-out';
      chatbot.style.transform = 'translate(0,0) scale(1)';
      setTimeout(() => { chatbot.style.transition = ''; chatbot.style.transform = ''; }, 950);
      scheduleIdle();
    }
  }

  scheduleIdle();

  const TRICKS = ['trick-flip', 'trick-wiggle', 'trick-spin', 'trick-moon', 'trick-dizzy'];
  let lastTrick = -1;
  chatbot.addEventListener('click', () => {
    const body = chatbot.querySelector('.bot-body');
    if (body.dataset.trick) return;
    // Aynı numara üst üste gelmesin
    let i;
    do { i = Math.floor(Math.random() * TRICKS.length); } while (i === lastTrick);
    lastTrick = i;
    const trick = TRICKS[i];
    body.dataset.trick = trick;
    body.classList.add(trick);
    body.addEventListener('animationend', function onEnd(e) {
      if (!e.animationName.startsWith('trick')) return;
      body.classList.remove(trick);
      delete body.dataset.trick;
      body.removeEventListener('animationend', onEnd);
    });
    input.focus();
  });

  function addPending() {
    const msg = el('div', 'msg bot pending');
    msg.appendChild(el('div', 'who', BOT_NAME));
    const b = el('div', 'bubble');
    b.appendChild(makeSLogo('slogo mini thinking'));
    const t = el('span', null, 'Analiz ediliyor…');
    b.appendChild(t);
    msg.appendChild(b);
    thread.appendChild(msg);
    scrollDown();
    const started = Date.now();
    const timer = setInterval(() => {
      t.textContent = 'Analiz ediliyor… ' + Math.round((Date.now() - started) / 1000) + ' sn';
    }, 1000);
    return { msg, stop: () => clearInterval(timer) };
  }

  function renderMarkdown(md) {
    const html = marked.parse(String(md), { gfm: true, breaks: true });
    return DOMPurify.sanitize(html);
  }

  function renderDataframe(art) {
    const wrap = el('div', 'df-wrap');
    if (art.name) wrap.appendChild(el('div', 'df-title', art.name));
    const scroll = el('div', 'df-scroll');
    const table = document.createElement('table');
    const cols = art.data?.columns || [];
    const rows = art.data?.data || [];
    const index = art.data?.index || [];
    // A non-default index (e.g. names instead of 0..n-1) carries row identity — show it
    const showIndex = index.length === rows.length && index.some((v, i) => v !== i);
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    if (showIndex) hr.appendChild(el('th', null, ''));
    cols.forEach(c => hr.appendChild(el('th', null, String(c))));
    thead.appendChild(hr);
    table.appendChild(thead);
    const tbody = document.createElement('tbody');
    rows.forEach((r, i) => {
      const tr = document.createElement('tr');
      if (showIndex) tr.appendChild(el('td', null, String(index[i])));
      (Array.isArray(r) ? r : [r]).forEach(v => tr.appendChild(el('td', null, v === null || v === undefined ? '—' : String(v))));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroll.appendChild(table);
    wrap.appendChild(scroll);
    return wrap;
  }

  function addBotMsg(payload, isError) {
    const msg = el('div', 'msg bot');
    msg.appendChild(el('div', 'who', BOT_NAME));
    const b = el('div', isError ? 'bubble error' : 'bubble');
    if (isError) {
      b.textContent = payload;
    } else {
      const md = el('div');
      md.innerHTML = renderMarkdown(payload.message || '(boş yanıt)');
      b.appendChild(md);
      (payload.artifacts || []).forEach(art => {
        if (art && art.type === 'dataframe' && art.data) {
          b.appendChild(renderDataframe(art));
        } else if (art) {
          const pre = el('pre');
          pre.textContent = JSON.stringify(art, null, 2);
          b.appendChild(pre);
        }
      });
      if (payload.warning) {
        b.appendChild(el('div', 'note warning', payload.warning));
      }
    }
    msg.appendChild(b);
    thread.appendChild(msg);
    scrollDown();
  }

  async function ask(question) {
    if (busy || !question.trim()) return;
    busy = true;
    setThinking(true);
    sendBtn.disabled = true;
    // Only clear the textarea if that's where the question came from (chips shouldn't wipe a draft)
    if (input.value.trim() === question.trim()) {
      input.value = '';
      autosize();
    }
    addUserMsg(question.trim());
    const pending = addPending();
    let resp = null;
    let data = {};
    try {
      resp = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: question.trim() }),
      });
      data = await resp.json().catch(() => ({}));
    } catch (err) {
      pending.stop();
      pending.msg.remove();
      addBotMsg('Sunucuya ulaşılamadı: ' + err.message, true);
      busy = false;
      setThinking(false);
      sendBtn.disabled = false;
      input.focus();
      return;
    }
    pending.stop();
    pending.msg.remove();
    updateCredit(data.quota);
    try {
      if (!resp.ok) {
        addBotMsg('Hata: ' + (data.error || resp.status + ' ' + resp.statusText), true);
      } else {
        addBotMsg(data, false);
      }
    } catch (err) {
      addBotMsg('Cevap görüntülenirken hata oluştu: ' + err.message, true);
    } finally {
      busy = false;
      setThinking(false);
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', () => ask(input.value));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      ask(input.value);
    }
  });

  function autosize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }
  input.addEventListener('input', autosize);

  document.getElementById('suggestions').addEventListener('click', (e) => {
    if (e.target.classList.contains('chip')) ask(e.target.textContent);
  });

  async function checkHealth() {
    try {
      const r = await fetch('/api/health');
      if (r.ok) {
        statusDot.className = 'dot ok';
        statusText.textContent = 'bağlı';
      } else {
        const d = await r.json().catch(() => ({}));
        statusDot.className = 'dot err';
        statusText.textContent = 'bağlantı sorunu';
        console.warn('health:', d);
      }
    } catch {
      statusDot.className = 'dot err';
      statusText.textContent = 'sunucuya ulaşılamıyor';
    }
  }
  async function loadQuota() {
    try {
      const r = await fetch('/api/quota');
      if (r.ok) updateCredit(await r.json());
    } catch { /* sayaç kritik değil */ }
  }
  // --- Ayarlar penceresi ---
  const settingsModal = document.getElementById('settingsModal');
  const serverList = document.getElementById('serverList');

  function selectTab(tabId) {
    document.querySelectorAll('.side-item').forEach(b =>
      b.classList.toggle('active', b.dataset.tab === tabId));
    document.getElementById('tabServers').hidden = tabId !== 'tabServers';
    document.getElementById('tabAdd').hidden = tabId !== 'tabAdd';
    if (tabId === 'tabServers') renderServers();
  }

  function openSettings() {
    settingsModal.hidden = false;
    // Her açılışta Bağlı Sistemler ile başla
    selectTab('tabServers');
  }
  function closeSettings() { settingsModal.hidden = true; }

  document.getElementById('settingsBtn').addEventListener('click', openSettings);
  document.getElementById('settingsClose').addEventListener('click', closeSettings);
  settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) closeSettings(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !settingsModal.hidden) closeSettings(); });

  document.querySelectorAll('.side-item').forEach(btn => {
    btn.addEventListener('click', () => selectTab(btn.dataset.tab));
  });

  async function renderServers() {
    serverList.textContent = 'Yükleniyor…';
    try {
      const r = await fetch('/api/servers');
      const servers = await r.json();
      serverList.textContent = '';
      if (!servers.length) {
        serverList.textContent = 'Kayıtlı sunucu yok. "Sunucu Ekle" sekmesinden ekleyebilirsiniz.';
        return;
      }
      servers.forEach(s => {
        const row = el('div', 'server-row');
        const info = el('div', 'srv-info');
        info.appendChild(el('div', 'srv-name', s.name));
        info.appendChild(el('div', 'srv-url', s.webUrl + ' · ' + s.username));
        row.appendChild(info);
        row.appendChild(el('span', 'badge product', s.product));
        if (s.active) {
          row.appendChild(el('span', 'badge on', 'Aktif'));
        } else {
          const act = el('button', 'btn', 'Aktif Yap');
          act.addEventListener('click', async () => {
            await fetch('/api/servers/' + s.id + '/activate', { method: 'POST' });
            renderServers();
            checkHealth();
            loadConfig();
          });
          row.appendChild(act);
        }
        const test = el('button', 'btn', 'Sına');
        const status = el('div', 'srv-status');
        test.addEventListener('click', async () => {
          status.textContent = 'Sınanıyor…';
          status.className = 'srv-status';
          try {
            const tr = await (await fetch('/api/servers/' + s.id + '/test', { method: 'POST' })).json();
            status.textContent = tr.detail;
            status.className = 'srv-status ' + (tr.ok ? 'ok' : 'fail');
          } catch {
            status.textContent = 'Test başarısız';
            status.className = 'srv-status fail';
          }
        });
        row.appendChild(test);
        const del = el('button', 'btn danger', 'Sil');
        del.addEventListener('click', async () => {
          if (!confirm('"' + s.name + '" sunucusunu silmek istediğinize emin misiniz?')) return;
          await fetch('/api/servers/' + s.id, { method: 'DELETE' });
          renderServers();
          checkHealth();
          loadConfig();
        });
        row.appendChild(del);
        row.appendChild(status);
        serverList.appendChild(row);
      });
    } catch {
      serverList.textContent = 'Sunucu listesi alınamadı.';
    }
  }

  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('addMsg');
    msg.textContent = 'Ekleniyor…';
    msg.className = 'form-msg';
    try {
      const r = await fetch('/api/servers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('fName').value,
          address: document.getElementById('fAddr').value,
          product: document.getElementById('fProd').value,
          username: document.getElementById('fUser').value,
          password: document.getElementById('fPass').value,
          acceptSelfSigned: document.getElementById('fCert').checked,
        }),
      });
      const d = await r.json();
      if (!r.ok) {
        msg.textContent = d.error || 'Eklenemedi.';
        msg.className = 'form-msg err';
        return;
      }
      msg.textContent = '"' + d.server.name + '" eklendi.';
      msg.className = 'form-msg ok';
      e.target.reset();
      document.getElementById('fCert').checked = true;
      document.querySelector('.side-item[data-tab="tabServers"]').click();
      renderServers();
    } catch {
      msg.textContent = 'Sunucuya ulaşılamadı.';
      msg.className = 'form-msg err';
    }
  });

  loadConfig();
  checkHealth();
  loadQuota();
  setInterval(checkHealth, 60000);
  input.focus();
</script>
</body>
</html>
